name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [main]
  # ...and allow deploying by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Pages must already be enabled with Source = "GitHub Actions"
      # (Settings -> Pages). The workflow token is not allowed to create the
      # Pages site itself, so there is no `enablement: true` here.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is plain static files — no build step needed.
      # Only the app/ folder is published, so the source PDFs stay out of the site.
      - name: Upload the app folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
